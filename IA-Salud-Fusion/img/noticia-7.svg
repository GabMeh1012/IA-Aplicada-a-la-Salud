<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="n7Title">
  <title id="n7Title">Globo terráqueo con líneas de red, representando la gobernanza global de la IA en políticas de salud</title>
  <defs>
    <linearGradient id="n7Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#134e6f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#n7Bg)"/>
  <g transform="translate(200,120)">
    <circle r="70" fill="none" stroke="#e6f4f3" stroke-opacity="0.6" stroke-width="2"/>
    <ellipse rx="70" ry="26" fill="none" stroke="#5eead4" stroke-opacity="0.6" stroke-width="1.5"/>
    <ellipse rx="70" ry="26" fill="none" stroke="#5eead4" stroke-opacity="0.5" stroke-width="1.5" transform="rotate(60)"/>
    <ellipse rx="70" ry="26" fill="none" stroke="#5eead4" stroke-opacity="0.5" stroke-width="1.5" transform="rotate(120)"/>
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#5eead4" stroke-opacity="0.5"/>
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#5eead4" stroke-opacity="0.3"/>
    <g fill="#fbbf24">
      <circle cx="20" cy="-30" r="4"/>
      <circle cx="-35" cy="20" r="4"/>
      <circle cx="45" cy="35" r="4"/>
    </g>
  </g>
  <text x="110" y="35" font-family="Arial, sans-serif" font-size="13" fill="#e6f4f3" opacity="0.85">Gobernanza global de la IA en salud</text>
</svg>
